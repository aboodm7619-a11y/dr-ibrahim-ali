<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A1E4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="زيارات الموقع">
<title>زيارات الموقع — Dr. Ibrahim Ali</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0A1E4A;--navy2:#132B63;--card:#10265A;--line:rgba(255,255,255,.10);--white:#fff;--muted:#9FB3DA;--ice:#E9F0FB;--accent:#5FA8FF}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Cairo,system-ui,sans-serif;background:linear-gradient(180deg,#071533 0%,var(--navy) 40%,#0B2257 100%);color:var(--white);min-height:100vh;padding:18px 16px 40px}
.wrap{max-width:560px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
header .t{font-size:13px;color:var(--muted);font-weight:600}
header h1{font-size:22px;font-weight:800;line-height:1.2}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#3DDC84;margin-inline-start:6px;box-shadow:0 0 0 0 rgba(61,220,132,.6);animation:p 2s infinite}
@keyframes p{70%{box-shadow:0 0 0 8px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.06);padding:5px;border-radius:14px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:700 14px Cairo,sans-serif;padding:9px 4px;border-radius:10px;cursor:pointer}
.tabs button.on{background:var(--white);color:var(--navy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.hero{text-align:center;padding:22px 16px}
.hero .n{font-size:64px;font-weight:800;line-height:1;letter-spacing:-1px}
.hero .l{color:var(--muted);font-weight:600;margin-top:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.mini{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.mini .n{font-size:30px;font-weight:800}
.mini .l{font-size:12.5px;color:var(--muted);font-weight:600}
h2{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.chart{display:flex;align-items:flex-end;gap:4px;height:120px;direction:ltr}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar i{display:block;width:100%;background:linear-gradient(180deg,var(--accent),#2E6BD1);border-radius:6px 6px 2px 2px;min-height:3px}
.bar b{font-size:10px;color:var(--muted);font-weight:600;margin-top:5px;white-space:nowrap}
.bar s{text-decoration:none;font-size:10.5px;font-weight:700;margin-bottom:3px}
.row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.row .nm{flex:0 0 42%;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tr{flex:1;height:9px;background:rgba(255,255,255,.07);border-radius:9px;overflow:hidden}
.row .tr i{display:block;height:100%;background:linear-gradient(90deg,#2E6BD1,var(--accent));border-radius:9px}
.row .c{font-weight:800;font-size:14px;min-width:26px;text-align:left}
.empty{color:var(--muted);font-size:13.5px}
.setup input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#0B1D45;color:#fff;font:600 14px monospace;direction:ltr;margin:10px 0}
.btn{width:100%;border:0;background:var(--white);color:var(--navy);font:800 15px Cairo,sans-serif;padding:13px;border-radius:12px;cursor:pointer}
.link{background:none;border:0;color:var(--muted);font:600 12.5px Cairo,sans-serif;text-decoration:underline;cursor:pointer}
.err{color:#FF9B9B;font-size:13.5px;margin-top:8px}
.foot{text-align:center;margin-top:18px;display:flex;flex-direction:column;gap:6px;align-items:center}
.upd{font-size:12px;color:var(--muted)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:s 0.8s linear infinite;vertical-align:middle}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="t">ortho-ibrahim.com</div><h1>زيارات الموقع<span class="dot"></span></h1></div>
    <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5.5c-1.6-1.4-3.4-2-5-1.6C4.6 4.5 3.6 7 4.2 9.6c.5 2.2 1.2 4 1.6 6.4.3 2 .9 4 2.2 4 1.4 0 1.5-2.4 2-4 .3-1 .8-1.6 2-1.6s1.7.6 2 1.6c.5 1.6.6 4 2 4 1.3 0 1.9-2 2.2-4 .4-2.4 1.1-4.2 1.6-6.4.6-2.6-.4-5.1-2.8-5.7-1.6-.4-3.4.2-5 1.6z"/></svg>
  </header>

  <div id="setup" class="card setup" hidden>
    <h2>🔑 أول مرة بس</h2>
    <div class="empty">الصق «مفتاح القراءة» اللي طلّعته من GoatCounter (API Token) واضغط حفظ. بيضل محفوظ على هالجهاز بس.</div>
    <input id="key" placeholder="API token" autocomplete="off" spellcheck="false">
    <button class="btn" id="save">حفظ وفتح الإحصائيات</button>
    <div class="err" id="serr"></div>
  </div>

  <div id="app" hidden>
    <div class="tabs" id="tabs">
      <button data-d="0" class="on">اليوم</button>
      <button data-d="6">٧ أيام</button>
      <button data-d="29">٣٠ يوم</button>
      <button data-d="364">سنة</button>
    </div>
    <div class="card hero"><div class="n" id="total">–</div><div class="l" id="totalL">زيارة اليوم</div></div>
    <div class="grid">
      <div class="mini"><div class="n" id="ig">–</div><div class="l">📸 من إنستغرام</div></div>
      <div class="mini"><div class="n" id="ua">–</div><div class="l">🇺🇦 من أوكرانيا</div></div>
    </div>
    <div class="card"><h2>📈 الزيارات يوم بيوم</h2><div class="chart" id="chart"></div></div>
    <div class="card"><h2>🔗 من وين إجوا</h2><div id="refs"></div></div>
    <div class="card"><h2>🌍 الدول</h2><div id="locs"></div></div>
    <div class="card"><h2>📱 الأجهزة</h2><div id="sys"></div></div>
    <div class="card"><h2>🌐 المتصفحات</h2><div id="brw"></div></div>
    <div class="foot">
      <div class="upd" id="upd"></div>
      <button class="link" id="reload">تحديث</button>
      <button class="link" id="reset">تغيير المفتاح</button>
    </div>
  </div>
</div>
<script>
var API='https://ortho-ibrahim.goatcounter.com/api/v0';
var DAYS=0, KEY='';
function $(i){return document.getElementById(i)}
function getKey(){try{return localStorage.getItem('gc_key')||''}catch(e){return ''}}
function setKey(k){try{localStorage.setItem('gc_key',k)}catch(e){}}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function range(){var e=new Date(),s=new Date();s.setDate(e.getDate()-DAYS);return {start:ymd(s),end:ymd(e)}}
var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
async function get(path,q){
  var u=new URL(API+path);Object.keys(q||{}).forEach(function(k){u.searchParams.set(k,q[k])});
  for(var a=0;a<3;a++){
    var r=await fetch(u,{headers:{'Authorization':'Bearer '+KEY,'Content-Type':'application/json'}});
    if(r.status===429){await sleep(1200);continue}
    if(r.status===401||r.status===403){var x=new Error('auth');x.auth=1;throw x}
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }
  throw new Error('rate');
}
var AR={'Ukraine':'أوكرانيا','Kuwait':'الكويت','Syria':'سوريا','Turkey':'تركيا','Türkiye':'تركيا','Germany':'ألمانيا','Poland':'بولندا','Saudi Arabia':'السعودية','United States':'أمريكا','Moldova':'مولدوفا','Romania':'رومانيا','Netherlands':'هولندا','Russia':'روسيا','United Kingdom':'بريطانيا','France':'فرنسا','Jordan':'الأردن','Lebanon':'لبنان','United Arab Emirates':'الإمارات','Qatar':'قطر','Egypt':'مصر'};
function nice(name,kind){
  if(!name) return kind==='refs'?'دخول مباشر (رابط أو بايو)':'غير معروف';
  if(kind==='refs'){var n=name.toLowerCase();if(n.indexOf('instagram')>-1)return 'إنستغرام';if(n.indexOf('facebook')>-1)return 'فيسبوك';if(n.indexOf('google')>-1)return 'غوغل';if(n.indexOf('t.me')>-1||n.indexOf('telegram')>-1)return 'تيليغرام';if(n.indexOf('whatsapp')>-1||n.indexOf('wa.me')>-1)return 'واتساب';}
  if(kind==='locs') return AR[name]||name;
  if(kind==='sys'){if(/ios|iphone|ipad/i.test(name))return 'آيفون / آيباد';if(/android/i.test(name))return 'أندرويد';if(/windows/i.test(name))return 'كمبيوتر ويندوز';if(/mac/i.test(name))return 'ماك';}
  return name;
}
function cnt(s){return s.count!=null?s.count:(s.count_unique!=null?s.count_unique:0)}
function list(el,stats,kind){
  el.innerHTML='';
  if(!stats||!stats.length){el.innerHTML='<div class="empty">لسا ما في بيانات</div>';return}
  var mx=Math.max.apply(null,stats.map(cnt))||1;
  stats.slice(0,6).forEach(function(s){
    var d=document.createElement('div');d.className='row';
    var nm=document.createElement('div');nm.className='nm';nm.textContent=nice(s.name,kind);
    var tr=document.createElement('div');tr.className='tr';var i=document.createElement('i');i.style.width=(cnt(s)/mx*100)+'%';tr.appendChild(i);
    var c=document.createElement('div');c.className='c';c.textContent=cnt(s);
    d.appendChild(nm);d.appendChild(tr);d.appendChild(c);el.appendChild(d);
  });
}
function chart(stats){
  var el=$('chart');el.innerHTML='';
  if(!stats||!stats.length){el.innerHTML='<div class="empty">لسا ما في بيانات</div>';return}
  var pts=stats.map(function(s){var v=s.daily!=null?s.daily:(s.hourly||[]).reduce(function(a,b){return a+b},0);return {d:s.day,v:v}});
  var hourly=false;
  if(DAYS===0&&stats[0]&&stats[0].hourly){hourly=true;pts=[];for(var h=0;h<24;h+=2){var v=(stats[0].hourly[h]||0)+(stats[0].hourly[h+1]||0);pts.push({d:h+':00',v:v})}}
  if(pts.length>31){var w=[];for(var k=0;k<pts.length;k+=7){var sum=0;for(var j=k;j<k+7&&j<pts.length;j++)sum+=pts[j].v;w.push({d:pts[k].d,v:sum})}pts=w}
  var mx=Math.max.apply(null,pts.map(function(p){return p.v}))||1;
  var step=Math.ceil(pts.length/8);
  pts.forEach(function(p,ix){
    var b=document.createElement('div');b.className='bar';
    var lab=hourly?p.d:p.d.slice(8,10)+'/'+p.d.slice(5,7);
    b.innerHTML='<s>'+(p.v||'')+'</s><i style="height:'+Math.max(2,p.v/mx*85)+'%"></i><b>'+(ix%step===0?lab:'&nbsp;')+'</b>';
    el.appendChild(b);
  });
}
async function load(){
  var r=range(), lbl={0:'زيارة اليوم',6:'زيارة بآخر ٧ أيام',29:'زيارة بآخر ٣٠ يوم',364:'زيارة بآخر سنة'}[DAYS];
  $('totalL').textContent=lbl;$('total').innerHTML='<span class="spin"></span>';$('upd').textContent='';
  try{
    var t=await get('/stats/total',r);
    $('total').textContent=t.total!=null?t.total:(t.total_utc||0);
    chart(t.stats);
    await sleep(300);var refs=await get('/stats/toprefs',Object.assign({limit:10},r));list($('refs'),refs.stats,'refs');
    var ig=(refs.stats||[]).filter(function(s){return /instagram/i.test(s.name||'')}).reduce(function(a,s){return a+cnt(s)},0);$('ig').textContent=ig;
    await sleep(300);var locs=await get('/stats/locations',Object.assign({limit:10},r));list($('locs'),locs.stats,'locs');
    var ua=(locs.stats||[]).filter(function(s){return /ukrain/i.test(s.name||'')||s.id==='UA'}).reduce(function(a,s){return a+cnt(s)},0);$('ua').textContent=ua;
    await sleep(300);var sys=await get('/stats/systems',Object.assign({limit:10},r));list($('sys'),sys.stats,'sys');
    await sleep(300);var br=await get('/stats/browsers',Object.assign({limit:10},r));list($('brw'),br.stats,'brw');
    $('upd').textContent='آخر تحديث: '+new Date().toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'});
  }catch(e){
    if(e.auth){showSetup('المفتاح غلط أو ما إلو صلاحية «Read statistics».');return}
    $('total').textContent='!';$('upd').textContent='صار في مشكلة بالاتصال، جرّب «تحديث».';
  }
}
function showSetup(msg){$('app').hidden=true;$('setup').hidden=false;$('serr').textContent=msg||''}
function showApp(){$('setup').hidden=true;$('app').hidden=false;load()}
$('save').onclick=function(){var k=$('key').value.trim();if(!k){$('serr').textContent='الصق المفتاح أول';return}KEY=k;setKey(k);$('key').value='';showApp()};
$('reset').onclick=function(){setKey('');KEY='';showSetup()};
$('reload').onclick=load;
document.querySelectorAll('#tabs button').forEach(function(b){b.onclick=function(){document.querySelectorAll('#tabs button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');DAYS=+b.dataset.d;load()}});
KEY=getKey(); if(KEY) showApp(); else showSetup();
</script>
</body>
</html>
