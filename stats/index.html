<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A1E4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الزيارات">
<title>زيارات الموقع</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Cairo,system-ui,sans-serif;background:#0A1E4A;color:#fff;min-height:100vh;padding:16px 14px 40px}
.w{max-width:520px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.top h1{font-size:20px;font-weight:800}
.top small{display:block;color:#9FB3DA;font-size:12px;font-weight:500}
.live{font-size:12px;color:#7CF0A9;font-weight:700}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.n{background:#13306E;border-radius:16px;padding:12px 6px;text-align:center}
.n b{display:block;font-size:34px;font-weight:800;line-height:1.1}
.n span{font-size:12.5px;color:#B8C8EA;font-weight:700}
.n.hi{background:#fff;color:#0A1E4A}.n.hi span{color:#0A1E4A}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:rgba(255,255,255,.08);border-radius:20px;padding:5px 11px;font-size:13px;font-weight:700}
h2{font-size:15px;font-weight:800;margin:4px 2px 8px}
.v{display:flex;align-items:center;gap:10px;background:#102A60;border-radius:14px;padding:10px 12px;margin-bottom:7px}
.v .f{font-size:26px;line-height:1}
.v .m{flex:1;min-width:0}
.v .m b{display:block;font-size:14.5px;font-weight:700}
.v .m i{font-style:normal;font-size:12.5px;color:#B8C8EA;font-weight:500}
.v .t{font-size:12.5px;color:#B8C8EA;font-weight:700;text-align:left;white-space:nowrap}
.v.new{outline:2px solid #7CF0A9}
.day{color:#9FB3DA;font-size:12.5px;font-weight:800;margin:12px 4px 6px}
.empty{color:#9FB3DA;text-align:center;padding:30px 0;font-weight:500}
.setup{background:#13306E;border-radius:16px;padding:18px}
.setup input{width:100%;padding:13px;border-radius:12px;border:0;background:#0A1E4A;color:#fff;font:700 18px monospace;text-align:center;letter-spacing:2px;margin:12px 0}
.btn{width:100%;border:0;background:#fff;color:#0A1E4A;font:800 15px Cairo,sans-serif;padding:13px;border-radius:12px}
.err{color:#FF9B9B;font-size:13.5px;margin-top:8px;text-align:center}
.more{display:block;margin:10px auto;background:none;border:1px solid rgba(255,255,255,.25);color:#fff;font:700 13px Cairo,sans-serif;padding:8px 18px;border-radius:20px}
</style>
</head>
<body>
<div class="w">
  <div class="top"><div><h1>زيارات الموقع</h1><small>ortho-ibrahim.com</small></div><div class="live" id="live">● مباشر</div></div>
  <div id="setup" class="setup" hidden>
    <b>أول مرة بس: اكتب كود الدخول</b>
    <input id="code" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <button class="btn" id="go">دخول</button>
    <div class="err" id="err"></div>
  </div>
  <div id="app" hidden>
    <div class="nums">
      <div class="n hi"><b id="c0">–</b><span>اليوم</span></div>
      <div class="n"><b id="c7">–</b><span>آخر ٧ أيام</span></div>
      <div class="n"><b id="c30">–</b><span>آخر ٣٠ يوم</span></div>
    </div>
    <div class="chips" id="chips"></div>
    <h2>كل الزيارات</h2>
    <div id="list"></div>
    <button class="more" id="more" hidden>عرض أكتر</button>
  </div>
</div>
<script>
var URL_='https://pkwvvvzbtnlstkxemgyq.supabase.co/rest/v1/rpc/get_visits';
var KEY='sb_publishable_5WJprXBOQzE9c_xjb1JL1g_a9kON6KI';
var CODE='', ROWS=[], SHOW=40, SEEN=0, timer=null;
function $(i){return document.getElementById(i)}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k)||'';localStorage.setItem(k,v)}catch(e){return ''}}
var CN={UA:'أوكرانيا',KW:'الكويت',SY:'سوريا',TR:'تركيا',DE:'ألمانيا',PL:'بولندا',SA:'السعودية',US:'أمريكا',MD:'مولدوفا',RO:'رومانيا',NL:'هولندا',RU:'روسيا',GB:'بريطانيا',FR:'فرنسا',JO:'الأردن',LB:'لبنان',AE:'الإمارات',QA:'قطر',EG:'مصر',IQ:'العراق',BH:'البحرين',OM:'عُمان',IT:'إيطاليا',ES:'إسبانيا',SE:'السويد',AT:'النمسا',CZ:'التشيك',BG:'بلغاريا',GE:'جورجيا',CA:'كندا'};
function flag(c){if(!c||c.length!==2||c==='XX'||c==='T1')return '🌐';return String.fromCodePoint.apply(null,[].map.call(c.toUpperCase(),function(x){return 127397+x.charCodeAt(0)}))}
function country(c){return c?(CN[c]||c):'بلد غير معروف'}
function device(ua){ua=ua||'';if(/iPhone/i.test(ua))return 'آيفون';if(/iPad/i.test(ua))return 'آيباد';if(/Android/i.test(ua))return 'أندرويد';if(/Windows/i.test(ua))return 'كمبيوتر';if(/Macintosh/i.test(ua))return 'ماك';return 'جهاز'}
function source(ref,ua){ua=ua||'';ref=(ref||'').toLowerCase();
  if(/Instagram/i.test(ua)||ref.indexOf('instagram')>-1)return '📸 إنستغرام';
  if(/FBAN|FBAV/i.test(ua)||ref.indexOf('facebook')>-1)return '📘 فيسبوك';
  if(/Telegram/i.test(ua)||ref.indexOf('t.me')>-1)return '✈️ تيليغرام';
  if(/WhatsApp/i.test(ua)||ref.indexOf('whatsapp')>-1)return '💬 واتساب';
  if(ref.indexOf('google')>-1)return '🔎 غوغل';
  if(ref.indexOf('ortho-ibrahim')>-1)return '↩️ من داخل الموقع';
  if(ref)return '🔗 '+ref.replace('https://','').replace('http://','').split('/')[0];
  return '🔗 رابط مباشر';}
function hm(d){return d.toLocaleTimeString('ar',{hour:'numeric',minute:'2-digit'})}
function dayLabel(d){var t=new Date();t.setHours(0,0,0,0);var x=new Date(d);x.setHours(0,0,0,0);var diff=Math.round((t-x)/864e5);
  if(diff===0)return 'اليوم';if(diff===1)return 'مبارح';return d.toLocaleDateString('ar',{weekday:'long',day:'numeric',month:'long'})}
async function fetchRows(){
  var since=new Date(Date.now()-30*864e5).toISOString();
  var r=await fetch(URL_,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({p_code:CODE,p_since:since})});
  if(r.status===401||r.status===403||r.status===400){var e=new Error('code');e.code=1;throw e}
  if(!r.ok)throw new Error('net');
  return r.json();
}
function render(){
  var now=Date.now(),t0=new Date();t0.setHours(0,0,0,0);
  var c0=0,c7=0,src={},cty={};
  ROWS.forEach(function(v){var d=new Date(v.ts);if(d>=t0)c0++;if(now-d<7*864e5)c7++;var s=source(v.ref,v.ua);src[s]=(src[s]||0)+1;var c=flag(v.country)+' '+country(v.country);cty[c]=(cty[c]||0)+1});
  $('c0').textContent=c0;$('c7').textContent=c7;$('c30').textContent=ROWS.length;
  var ch=$('chips');ch.innerHTML='';
  [cty,src].forEach(function(o){Object.keys(o).sort(function(a,b){return o[b]-o[a]}).slice(0,4).forEach(function(k){var s=document.createElement('span');s.className='chip';s.textContent=k+'  '+o[k];ch.appendChild(s)})});
  var L=$('list');L.innerHTML='';
  if(!ROWS.length){L.innerHTML='<div class="empty">لسا ما في زيارات</div>';$('more').hidden=true;return}
  var last='';
  ROWS.slice(0,SHOW).forEach(function(v,i){
    var d=new Date(v.ts),dl=dayLabel(d);
    if(dl!==last){var h=document.createElement('div');h.className='day';h.textContent=dl;L.appendChild(h);last=dl}
    var e=document.createElement('div');e.className='v'+(SEEN&&v.id>SEEN?' new':'');
    var f=document.createElement('div');f.className='f';f.textContent=flag(v.country);
    var m=document.createElement('div');m.className='m';
    var b=document.createElement('b');b.textContent=country(v.country)+' · '+device(v.ua);
    var it=document.createElement('i');it.textContent=source(v.ref,v.ua)+(v.path&&v.path!=='/'?' · '+v.path:'');
    m.appendChild(b);m.appendChild(it);
    var tt=document.createElement('div');tt.className='t';tt.textContent=hm(d);
    e.appendChild(f);e.appendChild(m);e.appendChild(tt);L.appendChild(e);
  });
  $('more').hidden=ROWS.length<=SHOW;
}
async function load(){
  try{var rows=await fetchRows();var prev=ROWS.length?ROWS[0].id:0;ROWS=rows;if(!SEEN)SEEN=prev;render();
    $('live').textContent='● مباشر · '+hm(new Date());$('live').style.color='#7CF0A9';
  }catch(e){
    if(e.code){ls('vcode','');showSetup('الكود غلط');return}
    $('live').textContent='● ما في اتصال';$('live').style.color='#FF9B9B';
  }
}
function showSetup(m){$('app').hidden=true;$('setup').hidden=false;$('err').textContent=m||'';if(timer)clearInterval(timer)}
function start(){$('setup').hidden=true;$('app').hidden=false;load();if(timer)clearInterval(timer);timer=setInterval(load,20000)}
$('go').onclick=function(){var c=$('code').value.trim().toUpperCase();if(!c)return;CODE=c;ls('vcode',c);start()};
$('more').onclick=function(){SHOW+=40;render()};
document.addEventListener('visibilitychange',function(){if(!document.hidden&&CODE)load()});
CODE=ls('vcode');if(CODE)start();else showSetup();
</script>
</body>
</html>

<style>.more[hidden]{display:none}</style>
